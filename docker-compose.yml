services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: quoridor-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quoridor-web
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
